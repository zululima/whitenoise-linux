this vault and start over.", "fi": "Uusi salasana salaa tämän laitteen holvin uudelleen. White Noise ei vieläkään voi nollata sitä. Jos unohdat sen, ainoa vaihtoehto on poistaa tämä holvi ja aloittaa alusta.", "ctx": ["Linux"], "tag": "checked by the translator", "shot": null}, {"id": "1705", "en": "The ngit web client a patch card opens. That site receives the patch link.", "fi": "ngit-verkkoasiakasohjelma, jonka patch-kortti avaa. Sivusto saa patchin linkin.", "ctx": ["Linux"], "tag": "", "shot": null}, {"id": "1706", "en": "The original message isn't loaded in this view.", "fi": "Alkuperäistä viestiä ei ole ladattu tähän näkymään.", "ctx": ["Linux"], "tag": "", "shot": null}, {"id": "1707", "en": "The passwords don't match. Type them again.", "fi": "Salasanat eivät täsmää. Kirjoita ne uudelleen.", "ctx": ["Linux"], "tag": "", "shot": null}, {"id": "1708", "en": "The relay in the middle stores and forwards. It never holds a key.", "fi": "Välissä oleva rele tallentaa ja välittää. Sillä ei koskaan ole avainta.", "ctx": ["Linux"], "tag": "", "shot": null}, {"id": "1709", "en": "The signer request was cancelled.", "fi": "Allekirjoituspyyntö peruttiin.", "ctx": ["Linux"], "tag": "", "shot": null}, {"id": "1710", "en": "The updated list is published to your relays.", "fi": "Päivitetty luettelo julkaistaan releillesi.", "ctx": ["Linux"], "tag": "", "shot": null}, {"id": "1711", "en": "The vault on this device was deleted. Pick a new password to start over.", "fi": "Tämän laitteen holvi poistettiin. Aloita alusta valitsemalla uusi salasana.", "ctx": ["Linux"], "tag": "", "shot": null}, {"id": "1712", "en": "The web client an event card opens. For example %s. %s is replaced with the event id.", "fi": "Verkkoasiakasohjelma, jonka tapahtumakortti avaa. Esimerkiksi %s. %s korvataan tapahtuman tunnisteella.", "ctx": ["Linux"], "tag": "", "shot": null}, {"id": "1713", "en": "Their messages stay hidden until you show them. Nothing is published, and you can unblock them here.", "fi": "Estettyjen viestit pysyvät piilossa, kunnes näytät ne. Mitään ei julkaista, ja voit poistaa eston täällä.", "ctx": ["Linux"], "tag": "", "shot": null}, {"id": "1714", "en": "Theme applied", "fi": "Teema otettu käyttöön", "ctx": ["Linux"], "tag": "", "shot": null}, {"id": "1715", "en": "Theme deleted", "fi": "Teema poistettu", "ctx": ["Linux"], "tag": "", "shot": null}, {"id": "1716", "en": "Theme font", "fi": "Teeman kirjasin", "ctx": ["Linux"], "tag": "", "shot": null}, {"id": "1717", "en": "Theme from Sidecar by dmnyc.", "fi": "Teema Sidecarista, tekijä dmnyc.", "ctx": ["Linux"], "tag": "", "shot": null}, {"id": "1718", "en": "Theme saved", "fi": "Teema tallennettu", "ctx": ["Linux"], "tag": "", "shot": null}, {"id": "1719", "en": "Theme shared with %s", "fi": "Teema jaettu keskusteluun %s", "ctx": ["Linux"], "tag": "", "shot": null}, {"id": "1720", "en": "Themes, text size, and the look of your conversations.", "fi": "Teemat, tekstin koko ja keskustelujen ulkoasu.", "ctx": ["Linux"], "tag": "", "shot": null}, {"id": "1721", "en": "These are installation prompts. Choose your agent, review its prompt, and paste it into that agent to connect it to White Noise. The prompt includes your public npub, never your private key, and asks the agent to explain the connector before requesting your approval to install it. Use only an agent you run and trust.", "fi": "Nämä ovat asennuskehotteita. Valitse agenttisi, tarkista sen kehote ja liitä se agenttiin, niin se yhdistyy White Noiseen. Kehotteessa on julkinen npubisi, ei koskaan yksityistä avaintasi, ja se pyytää agenttia selittämään connectorin ennen kuin se pyytää lupaasi asentaa sen. Käytä vain agenttia, jota itse ajat ja johon luotat.", "ctx": ["Linux"], "tag": "", "shot": null}, {"id": "1722", "en": "These settings and messages are only yours.", "fi": "Nämä asetukset ja viestit ovat vain sinun.", "ctx": ["Linux"], "tag": "", "shot": null}, {"id": "1723", "en": "They can be added to a chat.", "fi": "Hänet voi lisätä keskusteluun.", "ctx": ["Linux"], "tag": "", "shot": null}, {"id": "1724", "en": "They come off your published contact list. Groups you already share stay as they are.", "fi": "Hänet poistetaan julkaistusta yhteystietoluettelostasi. Yhteiset ryhmänne pysyvät ennallaan.", "ctx": ["Linux"], "tag": "", "shot": null}, {"id": "1725", "en": "They haven't published a relay list.", "fi": "Hän ei ole julkaissut relelistaa.", "ctx": ["Linux"], "tag": "", "shot": null}, {"id": "1726", "en": "They lose access to new messages in this group.", "fi": "Hän menettää pääsyn tämän ryhmän uusiin viesteihin.", "ctx": ["Linux"], "tag": "", "shot": null}, {"id": "1727", "en": "They stay in the group as a regular member.", "fi": "Hän pysyy ryhmässä tavallisena jäsenenä.", "ctx": ["Linux"], "tag": "", "shot": null}, {"id": "1728", "en": "This changes White Noise project metadata, not running shells.", "fi": "Tämä muuttaa White Noisen projektin metatietoja, ei käynnissä olevia shellejä.", "ctx": ["Linux"], "tag": "", "shot": null}, {"id": "1729", "en": "This chat is archived. Restore it from Archive to send messages.", "fi": "Tämä keskustelu on arkistoitu. Palauta se arkistosta, jotta voit lähettää viestejä.", "ctx": ["Linux"], "tag": "", "shot": null}, {"id": "1730", "en": "This has no visible text, so the GM button sends GM.", "fi": "Tässä ei ole näkyvää tekstiä, joten GM-painike lähettää GM.", "ctx": ["Linux"], "tag": "checked by the translator", "shot": null}, {"id": "1731", "en": "This is a common password", "fi": "Tämä on yleinen salasana", "ctx": ["Linux"], "tag": "", "shot": null}, {"id": "1732", "en": "This is an installation prompt for connecting this Claude Code setup to White Noise through Marmot. Read the authoritative Claude Code harness guide at https://github.com/marmot-protocol/mdk/blob/master/integrations/claude/marmot/README.md and the evergreen connector guide at https://github.com/marmot-protocol/mdk/blob/master/crates/agent-connector/README.md. Explain to me how the connector works and what the installation will change. Confirm prerequisites: Claude Code CLI is installed, authenticated, and available on PATH, and this machine uses the same public relay set as my current account in the White Noise app. Then propose the installation steps for my public npub: %s, and ask for my approval before making any changes. Once I approve, use the checksum-verified install-claude-marmot.sh release flow, bootstrap wn-agent for that npub with the allowed welcomer, and verify wn-claude --version. Then reply with your agent npub and ask me to invite it from White Noise and send a test message from this allowed npub over the configured relays. Do not report setup complete until wn-claude returns a reply through White Noise; if that round trip cannot be verified automatically, clearly mark device verification required.", "fi": "Tämä on asennuskehote, jolla tämä Claude Code -asennus yhdistetään White Noiseen Marmotin kautta. Lue ensisijainen Claude Code -integraatio-opas osoitteessa https://github.com/marmot-protocol/mdk/blob/master/integrations/claude/marmot/README.md ja aina ajantasainen connector-opas osoitteessa https://github.com/marmot-protocol/mdk/blob/master/crates/agent-connector/README.md. Selitä minulle, miten connector toimii ja mitä asennus muuttaa. Varmista esivaatimukset: Claude Code CLI on asennettu, todennettu ja käytettävissä PATHissa, ja tämä kone käyttää samaa julkista relejoukkoa kuin nykyinen tilini White Noise -sovelluksessa. Ehdota sitten asennusvaiheet julkiselle npubilleni: %s, ja pyydä hyväksyntääni ennen kuin teet muutoksia. Kun hyväksyn, käytä tarkistussummalla varmennettua install-claude-marmot.sh-julkaisuprosessia, alusta wn-agent kyseiselle npubille sallitun welcomerin kanssa ja varmista wn-claude --version. Vastaa sitten agenttisi npubilla ja pyydä minua kutsumaan se White Noisesta ja lähettämään testiviesti tästä sallitusta npubista määritettyjen releiden kautta. Älä ilmoita käyttöönottoa valmiiksi ennen kuin wn-claude vastaa White Noisen kautta; jos tätä edestakaista viestiä ei voida varmistaa automaattisesti, merkitse selvästi, että vaaditaan varmistus laitteella.", "ctx": ["Linux"], "tag": "", "shot": null}, {"id": "1733", "en": "This is an installation prompt for connecting this Codex setup to White Noise through Marmot. Read the authoritative Codex harness guide at https://github.com/marmot-protocol/mdk/blob/master/integrations/codex/marmot/README.md and the evergreen connector guide at https://github.com/marmot-protocol/mdk/blob/master/crates/agent-connector/README.md. Explain to me how the connector works and what the installation will change. Confirm prerequisites: Codex CLI is installed, authenticated, and available on PATH, and this machine uses the same public relay set as my current account in the White Noise app. Then propose the installation steps for my public npub: %s, and ask for my approval before making any changes. Once I approve, use the checksum-verified install-codex-marmot.sh release flow, bootstrap wn-agent for that npub with the allowed welcomer, and verify wn-codex --version. Then reply with your agent npub and ask me to invite it from White Noise and send a test message from this allowed npub over the configured relays. Do not report setup complete until wn-codex returns a reply through White Noise; if that round trip cannot be verified automatically, clearly mark device verification required.", "fi": "Tämä on asennuskehote, jolla tämä Codex-asennus yhdistetään White Noiseen Marmotin kautta. Lue ensisijainen Codex-integraatio-opas osoitteessa https://github.com/marmot-protocol/mdk/blob/master/integrations/codex/marmot/README.md ja aina ajantasainen connector-opas osoitteessa https://github.com/marmot-protocol/mdk/blob/master/crates/agent-connector/README.md. Selitä minulle, miten connector toimii ja mitä asennus muuttaa. Varmista esivaatimukset: Codex CLI on asennettu, todennettu ja käytettävissä PATHissa, ja tämä kone käyttää samaa julkista relejoukkoa kuin nykyinen tilini White Noise -sovelluksessa. Ehdota sitten asennusvaiheet julkiselle npubilleni: %s, ja pyydä hyväksyntääni ennen kuin teet muutoksia. Kun hyväksyn, käytä tarkistussummalla varmennettua install-codex-marmot.sh-julkaisuprosessia, alusta wn-agent kyseiselle npubille sallitun welcomerin kanssa ja varmista wn-codex --version. Vastaa sitten agenttisi npubilla ja pyydä minua kutsumaan se White Noisesta ja lähettämään testiviesti tästä sallitusta npubista määritettyjen releiden kautta. Älä ilmoita käyttöönottoa valmiiksi ennen kuin wn-codex vastaa White Noisen kautta; jos tätä edestakaista viestiä ei voida varmistaa automaattisesti, merkitse selvästi, että vaaditaan varmistus laitteella.", "ctx": ["Linux"], "tag": "", "shot": null}, {"id": "1734", "en": "This is an installation prompt for connecting this Hermes installation to White Noise through Marmot. Read the latest connector guide at https://github.com/marmot-protocol/mdk/blob/master/integrations/hermes/marmot/README.md / https://github.com/marmot-protocol/mdk/blob/master/crates/agent-connector/README.md. Explain to me how the connector works and what the installation will change. Then propose the installation steps for my public npub: %s, and ask for my approval before making any changes. Once I approve, install and verify the connector, then reply with your agent npub. Before proposing changes, confirm the intended Hermes profile, Hermes home, Marmot home/socket, agent account and service, and gateway instance; do not assume the default profile or overwrite another installation. Use the checksum-verified Hermes installer flow. Distinguish invite authorization from message-sender authorization. Guide me through the invitation from my current account in the White Noise app and a test message, and verify that the selected profile replies in White Noise before calling pairing complete.", "fi": "Tämä on asennuskehote, jolla tämä Hermes-asennus yhdistetään White Noiseen Marmotin kautta. Lue uusin connector-opas osoitteessa https://github.com/marmot-protocol/mdk/blob/master/integrations/hermes/marmot/README.md / https://github.com/marmot-protocol/mdk/blob/master/crates/agent-connector/README.md. Selitä minulle, miten connector toimii ja mitä asennus muuttaa. Ehdota sitten asennusvaiheet julkiselle npubilleni: %s, ja pyydä hyväksyntääni ennen kuin teet muutoksia. Kun hyväksyn, asenna ja varmista connector ja vastaa sitten agenttisi npubilla. Ennen kuin ehdotat muutoksia, varmista aiottu Hermes-profiili, Hermes home, Marmot home/socket, agentin tili ja palvelu sekä gateway-instanssi; älä oleta oletusprofiilia äläkä korvaa toista asennusta. Käytä tarkistussummalla varmennettua Hermes-asennusprosessia. Erota kutsujen valtuutus viestien lähettäjien valtuutuksesta. Opasta minut kutsumaan agentti nykyiseltä tililtäni White Noise -sovelluksessa ja lähettämään testiviesti, ja varmista, että valittu profiili vastaa White Noisessa, ennen kuin ilmoitat parinmuodostuksen valmiiksi.", "ctx": ["Linux"], "tag": "", "shot": null}, {"id": "1735", "en": "This is what a message alert looks like.", "fi": "Tältä viesti-ilmoitus näyttää.", "ctx": ["Linux"], "tag": "", "shot": null}, {"id": "1736", "en": "This is your secret key, encrypted with the password you entered. Whoever holds this string and that password controls your identity.", "fi": "Tämä on yksityinen avaimesi salattuna antamallasi salasanalla. Se, jolla on tämä merkkijono ja salasana, hallitsee identiteettiäsi.", "ctx": ["Linux"], "tag": "", "shot": null}, {"id": "1737", "en": "This key has a typo.", "fi": "Tässä avaimessa on kirjoitusvirhe.", "ctx": ["Linux"], "tag": "", "shot": null}, {"id": "1738", "en": "This leaves White Noise and opens in your browser.", "fi": "Siirryt pois White Noisesta, ja sivu avautuu selaimessasi.", "ctx": ["Linux"], "tag": "", "shot": null}, {"id": "1739", "en": "This leaves White Noise and opens the call in %s.", "fi": "Siirryt pois White Noisesta, ja puhelu avautuu sovelluksessa %s.", "ctx": ["Linux"], "tag": "", "shot": null}, {"id": "1740", "en": "This name is public. You can change it later in your profile.", "fi": "Tämä nimi on julkinen. Voit muuttaa sitä myöhemmin profiilissasi.", "ctx": ["Linux"], "tag": "", "shot": null}, {"id": "1741", "en": "This number increases when the group's encryption keys change.", "fi": "Tämä luku kasvaa, kun ryhmän salausavaimet vaihtuvat.", "ctx": ["Linux"], "tag": "", "shot": null}, {"id": "1742", "en": "This pairing link is too long for a QR code. Use Copy pairing link.", "fi": "Parinmuodostuslinkki on liian pitkä QR-koodiksi. Käytä Kopioi parinmuodostuslinkki -toimintoa.", "ctx": ["Linux"], "tag": "", "shot": null}, {"id": "1743", "en": "This password encrypts the vault on this device. It doesn't create an account, and White Noise can't reset it.", "fi": "Tämä salasana salaa tämän laitteen holvin. Se ei luo tiliä, eikä White Noise voi nollata sitä.", "ctx": ["Linux"], "tag": "", "shot": null}, {"id": "1744", "en": "This password is easy to guess. Someone with this device could guess it and open the vault.", "fi": "Tämä salasana on helppo arvata. Joku, jolla on tämä laite, voisi arvata sen ja avata holvin.", "ctx": ["Linux"], "tag": "", "shot": null}, {"id": "1745", "en": "This project is no longer available.", "fi": "Tämä projekti ei ole enää saatavilla.", "ctx": ["Linux"], "tag": "", "shot": null}, {"id": "1746", "en": "This project is no longer available. Close this editor and reopen it from the current project.", "fi": "Tämä projekti ei ole enää saatavilla. Sulje tämä editori ja avaa se uudelleen nykyisestä projektista.", "ctx": ["Linux"], "tag": "", "shot": null}, {"id": "1747", "en": "This relay is already in your list.", "fi": "Tämä rele on jo luettelossasi.", "ctx": ["Linux"], "tag": "", "shot": null}, {"id": "1748", "en": "This session", "fi": "Tämä istunto", "ctx": ["Linux"], "tag": "", "shot": null}, {"id": "1749", "en": "This sticker is not in the current pack.", "fi": "Tämä tarra ei ole nykyisessä pa
